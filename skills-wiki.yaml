    Explode Radius Range 13m
  detail_notes:
  - The trap deals Fire damage and applies Burning.
  - If the trap is detonated by direct damage or fire surface owned by a character,
    it will explode for 167% attribute-independent level scaling, alongside all of
    that character's damage affecting stats except str/int/fin. i.e. pyrokinetic,
    crit, damage buff, etc.
