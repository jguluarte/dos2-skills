- name: Thick of the Fight
  primary_tree: Warfare
  investment: 3
  url: https://divinityoriginalsin2.wiki.fextralife.com/Thick+of+the+Fight
  ap_cost: 2
  sp_cost: 1
  cooldown: 4
  description: The more the merrier! Gain a damage boost for every nearby characte
  effect: Set Thick of the Fight for 2 turn(s).
  detail_description: The more the merrier! Gain a damage boost for every nearby character.
  detail_effect: Set Thick of the Fight for 2 turn(s).
  detail_requirements: Requires Warfare 3 Costs 2 Memory
  detail_notes:
  - The damage boost is 10% per all nearby characters, this includes yourself, enemies,
    summons, and totems.
  - There is no craftable scroll recipe for this skill
  - Thick of the Fight is a "misc" bonus, which figures differently into the damage
    formulas for weapon-based attacks and spells. The misc bonus is additive with
    attribute and weapon skill bonuses for weapon-based attacks, but it is a standalone
    multiplier in the damage formula for spells.
  - This means that Thick of the Fight is quite strong for spells throughout the game,
    but it becomes increasingly mediocre for weapon-based attacks. At level 20, a
    +50% bonus from Thick of the Fight would likely only increase weapon damage by
    about 15% multiplicatively.
