- name: Conjure Incarnate
  primary_tree: Summoning
  investment: 1
  url: https://divinityoriginalsin2.wiki.fextralife.com/Conjure+Incarnate
  ap_cost: 2
  sp_cost: 0
  range: 13m
  cooldown: 5
  description: Conjure a personal elemental that matches the ground surface it's summoned
    onto. Your incarnate can be buffed with Infusions. Once you hit Summoning ability
    level of 10, a colossal Incarnate Champion will answer your summons!
  effect: The stats of the summons will depend on caster level and Summoning ability.
    Duration 10 turn(s)
  detail_description: Conjure a personal elemental that matches the ground surface
    it's summoned onto. Your incarnate can be buffed with Infusions. Once you hit
    Summoning ability level of 10, a colossal Incarnate Champion will answer your
    summons!
  detail_requirements: Requires Summoning 1 Duration 10 turns Range 13m
  detail_notes:
  - The cornerstone of the Summoning skill tree, it can be buffed with different Infusions
    that give new skills — Farsight , Power , Warp , Shadow — or replace its element
    (see below).
  - The potency of its spells are based on its stats, not its owner. Right click it
    and choose "Examine" for details on its attributes.
  - The Incarnate can act the turn it is summoned in battle, shuffling turn order
    when it does.
  - Incarnate innately has the Opportunist talent. Provoke was removed as of Patch
    v3.0.168.526
  - Summoning the Incarnate either before or in the middle of battle has their own
    advantages; the Incarnate in most cases will behave like another player character.
  - The only time the Incarnate's form changes is once Summoning reaches level 10;
    nothing changes if it goes beyond that. Its color also corresponds to its imbued
    element.
  - The Incarnate Champion is significantly larger than a regular Incarnate and spawns
    with double the Physical Armour and Magical Armour as well as almost double the
    Vitality, and deals approx. 50% more damage.
  - The environment the Incarnate is spawned in imbues it with an element, granting
    different abilities and skills. It can be also imbued with a different element
    by casting specific Summoning skills. Some elements can only be obtained by only
    one of either method.
  - Infusing the Incarnate also determines the element of its basic attack. Be wary
    when confronting groups of enemies with different resistances. It matches the
    element of the skill that comes with it, e.g, Blood infusion bestows normal physical
    attacks.
  - Summoning bonus is multilpicative for armor, health and spell damage but additive
    for attacks and attack based spells. Also summoning itself is additive with Supercharger
    .
  - As of patch 3.6.36.1643 air, fire, water and poison infusions will give 5 points
    of corresponding ability, while oil, acid, cursed air and necrofire will give
    10 points. It seems that this bonus does not depend on the character level or
    summoning ability.
  - 'There seems to be a bug (probably due to a recent patch) that affects how this
    spell react to electrified surfaces : while outside of combat, it is currently
    working as intended, during combat, the incarnate will be infused with the basic
    surface despite the electricity (creating a blood/water incarnate instead of an
    electric one). Totems seem to be unaffected by this bug.'
