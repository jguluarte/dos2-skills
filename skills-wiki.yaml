  description: Create a smoke cloud around you, hiding from sight.
  detail_description: Create a smoke cloud around you, hiding from sight.
  detail_requirements: Requires Aerotheurge 1 Requires Scoundrel 1 Costs 1 Memory
    Range --
  detail_notes:
  - You can use Smoke Cover to quickly pickpocket people even while everyone is looking
    (Useful to rid guards of grenades/arrows, or to get a specific item or two).
  - Bless the Smoke Cover (Grants invisibility) if you want more time stealing.
  - On solo Lone Wolf play-through, you can use Smoke cover in round one to force
    enemies to move out of position instead of attacking.
  - This Skill now costs 1 AP and has a 3m radius as of Patch v3.0.168.526
- name: Blessed Smoke Cloud
  primary_tree: Aerotheurge
  secondary_tree: Scoundrel
  investment: 2
  url: https://divinityoriginalsin2.wiki.fextralife.com/Blessed+Smoke+Cloud
  ap_cost: 1
  sp_cost: 2
  range: 13m. Area of Effect:4m radius. Ground-targettable.
  cooldown: 5
  description: Conjure a cloud of thick blessed smoke that makes characters invisible.
  detail_description: Conjure a cloud of thick blessed smoke that makes characters
    invisible.
  detail_requirements: 'Requires Aerotheurge 2 Requires Scoundrel 2 Range 13m . Area
    of Effect: 4m radius. Ground-targettable.'
  detail_notes:
  - Invisibility will be removed by effects (such as Wet from rain) until the turn
    of the character(s) inside the cloud arrive, in which case Invisibility will be
    re-applied.
  - As it is a Blessed environmental effect, Curse will revert it into a normal smoke
    cloud.
  - Other ways to get blessed smoke clouds is to first use a smoke grenade or arrow
    and then bless it, alternatively use Smoke Cloud to spawn it around the character.
    While these methods cost more AP (and is non-targetable in case of Smoke Cover),
    they cost one less Source
  - Area of Effect was increased to 4m (from 3m) as of Patch v3.0.168.526
