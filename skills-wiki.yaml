- name: Smoke Cover
  primary_tree: Aerotheurge
  secondary_tree: Scoundrel
  investment: 1
  url: https://divinityoriginalsin2.wiki.fextralife.com/Smoke+Cover
  ap_cost: 1
  sp_cost: 0
