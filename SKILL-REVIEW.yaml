- name: Ethereal Storm
  primary_tree: Summoning
  investment: 5
  ap_cost: 4
  sp_cost: 3
  range: 17m
  cooldown: 5
  wiki_detail: >
    Unpredictable projectiles from distant planes strike target area, dealing
    random elemental damage to enemies or healing allies.
  wiki_status: Duration 2 Turn (s)
  wiki_notes:
    - Scroll crafted by combine Sheet of Paper , Source Orb , and Carrot
    - >
      This skill is fully capable of using poison damage on undead enemies (thus
      healing them) and using healing on your undead allies (this damaging
      them). That also goes for any other elemental immunities or absorptions
      that enemies might have.
    - >
      This skill's healing will specifically target allies, and applies a
      regenerative healing effect that heals approximately the same amount as
      First Aid every turn.
  proposed_effect: >
    Unpredictable projectiles from distant planes strike target area, dealing
    random elemental damage to enemies or healing allies.
  url:
    https://divinityoriginalsin2.wiki.fextralife.com/Ethereal+Storm


