- name: Conjure Incarnate
  primary_tree: Summoning
  investment: 1
  ap_cost: 2
  sp_cost: 0
  range: 13m
  cooldown: 5
  wiki_detail: >
    Conjure a personal elemental that matches the ground surface it's summoned
    onto. Your incarnate can be buffed with Infusions. Once you hit Summoning
    ability level of 10, a colossal Incarnate Champion will answer your
    summons!
  wiki_status: >
    The stats of the summons will depend on caster level and Summoning
    ability. Duration 10 turn(s)
  wiki_notes:
    - >
      The cornerstone of the Summoning skill tree, it can be buffed with
      different Infusions that give new skills — Farsight, Power, Warp, Shadow —
      or replace its element (see below).
    - >
      The potency of its spells are based on its stats, not its owner. Right
      click it and choose "Examine" for details on its attributes.
    - >
      The Incarnate can act the turn it is summoned in battle, shuffling turn
      order when it does.
  proposed_effect: >
    Conjure a personal elemental that matches the ground surface it's summoned
    onto. Your incarnate can be buffed with Infusions. Once you hit Summoning
    ability level of 10, a colossal Incarnate Champion will answer your
    summons!
  url:
    https://divinityoriginalsin2.wiki.fextralife.com/Conjure+Incarnate

