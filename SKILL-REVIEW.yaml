- name: Supercharger
  primary_tree: Summoning
  investment: 2
  ap_cost: 1
  sp_cost: 0
  range: 13m
  cooldown: 3
  wiki_detail: >
    Target totem or summon deals 100% more base damage during its next turn,
    but then it dies.
  wiki_status: Set Supercharged for 2 turn(s).
  wiki_notes:
    - >
      Supercharger bonus increased to 70% (Was 50%), tooltip now mentions that
      it can be cast on totems as of Patch v3.0.168.526
    - >
      Supercharger is additive with summoning bonus, futhermore both
      Supercharger and Summoning are additive with the attacks and attack based
      spells and multiplicative with spells. For example summoned creature with
      40 STR, 40 INT, 10 Warfare and 10 Aeroteurge will have mutliplier of 3.75
      for attacks and air spells. Adding 10 Summoning will turn it to 5.25 and
      7.5 respectively. Adding Supercharger on top of this will increase
      multipliers to 6.75 and 11.25.
    - ??
  proposed_effect: >
    Target totem or summon deals 100% more base damage during its next turn,
    but then it dies. Lasts 2 turns.
  url:
    https://divinityoriginalsin2.wiki.fextralife.com/Supercharger

